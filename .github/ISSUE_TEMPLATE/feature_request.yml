name: Feature request
description: Suggest a new capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        Start the issue title with a conventional prefix like `feat:`, `fix:`, `chore:`, or `docs:`. For feature requests, `feat:` is usually the right choice.

  - type: textarea
    id: request
    attributes:
      label: What do you want?
      placeholder: Describe the feature or improvement you'd like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Optional context on the use case or why this matters.
      placeholder: This would help when ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Optional mockups, examples, links, or related issues.
      placeholder: Links, screenshots, examples, related issues, etc.
    validations:
      required: false

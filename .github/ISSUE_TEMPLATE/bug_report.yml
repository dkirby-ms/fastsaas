name: Bug report
description: Report something broken with a short, simple form
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep it brief.

        Start the issue title with a conventional prefix like `fix:`, `feat:`, `chore:`, or `docs:`. For bug reports, `fix:` is usually the right choice.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: A short summary of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Optional, but helpful.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Optional error messages, screenshots, environment details, or anything else useful.
      placeholder: Error text, browser/OS, screenshots, links, etc.
    validations:
      required: false

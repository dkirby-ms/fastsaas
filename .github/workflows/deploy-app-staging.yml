name: Deploy staging application

on:
  workflow_run:
    workflows: ["Release"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Azure resource group for staging
        required: false
        default: rg-fastsaas-staging
      location:
        description: Azure region
        required: false
        default: centralus
      environmentName:
        description: Logical environment name
        required: false
        default: staging
      imageTag:
        description: Image tag to deploy or roll back to
        required: false
        default: ''
      skipBuild:
        description: Skip docker build and reuse an existing image tag
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  deploy-app:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ inputs.resourceGroup || 'rg-fastsaas-staging' }}
      LOCATION: ${{ inputs.location || 'centralus' }}
      ENVIRONMENT_NAME: ${{ inputs.environmentName || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c  # v3
        with:
          client-id: ${{ secrets.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_OIDC_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment values
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ inputs.imageTag }}
          SKIP_BUILD_INPUT: ${{ inputs.skipBuild }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            if [[ ! "$IMAGE_TAG_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "imageTag must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" >&2
              exit 1
            fi
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG_INPUT" >> "$GITHUB_ENV"
          else
            printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

          printf 'SKIP_BUILD=%s\n' "$SKIP_BUILD_INPUT" >> "$GITHUB_ENV"

      - name: Resolve staging registry
        id: registry
        shell: bash
        run: |
          if [ "$(az group exists --name "$RESOURCE_GROUP")" != "true" ]; then
            echo "Resource group $RESOURCE_GROUP does not exist. Run the infrastructure workflow first." >&2
            exit 1
          fi

          ACR_COUNT=$(az acr list --resource-group "$RESOURCE_GROUP" --query 'length(@)' -o tsv)
          if [ "$ACR_COUNT" -eq 0 ]; then
            echo "No Azure Container Registry found in $RESOURCE_GROUP. Run the infrastructure workflow first." >&2
            exit 1
          fi

          if [ "$ACR_COUNT" -ne 1 ]; then
            echo "Expected exactly one Azure Container Registry in $RESOURCE_GROUP, found $ACR_COUNT." >&2
            az acr list --resource-group "$RESOURCE_GROUP" --query '[].name' -o tsv >&2
            exit 1
          fi

          ACR_NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)
          ACR_LOGIN_SERVER=$(az acr show --resource-group "$RESOURCE_GROUP" --name "$ACR_NAME" --query loginServer -o tsv)

          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          {
            echo "## Staging application deployment"
            echo "- ACR name: \`$ACR_NAME\`"
            echo "- ACR login server: \`$ACR_LOGIN_SERVER\`"
            echo "- Image tag: \`${IMAGE_TAG:-$GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build API image in ACR
        if: env.SKIP_BUILD != 'true'
        run: |
          az acr build \
            --registry "${{ steps.registry.outputs.acr_name }}" \
            --image "fastsaas-api:${IMAGE_TAG}" \
            --file packages/api/Dockerfile \
            .

      - name: Build portal image in ACR
        if: env.SKIP_BUILD != 'true'
        run: |
          az acr build \
            --registry "${{ steps.registry.outputs.acr_name }}" \
            --image "fastsaas-portal:${IMAGE_TAG}" \
            --file packages/portal/Dockerfile \
            .

      - name: Validate existing images for skipBuild
        if: env.SKIP_BUILD == 'true'
        shell: bash
        env:
          ACR_NAME: ${{ steps.registry.outputs.acr_name }}
        run: |
          for repository in fastsaas-api fastsaas-portal; do
            tag=$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$repository" \
              --query "[?@=='$IMAGE_TAG'] | [0]" \
              -o tsv)

            if [ "$tag" != "$IMAGE_TAG" ]; then
              echo "skipBuild=true requires an existing image tag. Could not find $repository:$IMAGE_TAG in ACR $ACR_NAME." >&2
              exit 1
            fi
          done

      - name: Resolve container app targets
        run: |
          echo "API_APP_NAME=${ENVIRONMENT_NAME}-api" >> "$GITHUB_ENV"
          echo "PORTAL_APP_NAME=${ENVIRONMENT_NAME}-portal" >> "$GITHUB_ENV"
          echo "API_IMAGE=${{ steps.registry.outputs.acr_login_server }}/fastsaas-api:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "PORTAL_IMAGE=${{ steps.registry.outputs.acr_login_server }}/fastsaas-portal:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Ensure container apps exist
        shell: bash
        run: |
          for app_name in "$API_APP_NAME" "$PORTAL_APP_NAME"; do
            if ! az containerapp show --resource-group "$RESOURCE_GROUP" --name "$app_name" >/dev/null; then
              echo "Container App $app_name does not exist in $RESOURCE_GROUP." >&2
              echo "This workflow now performs in-place updates to preserve custom domains, so the staging apps must already exist before rerunning it." >&2
              exit 1
            fi
          done

      - name: Render container app runtime config
        shell: bash
        env:
          API_ENV_FILE: infrastructure/env/.generated-staging-api.env.json
          API_SECRETS_FILE: infrastructure/env/.generated-staging-api.secrets.json
          PORTAL_ENV_FILE: infrastructure/env/.generated-staging-portal.env.json
          PORTAL_SECRETS_FILE: infrastructure/env/.generated-staging-portal.secrets.json
          API_ENTRA_CLIENT_ID: ${{ secrets.API_ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          MARKETPLACE_CLIENT_ID: ${{ secrets.MARKETPLACE_CLIENT_ID }}
          MARKETPLACE_CLIENT_SECRET: ${{ secrets.MARKETPLACE_CLIENT_SECRET }}
          MARKETPLACE_TENANT_ID: ${{ secrets.MARKETPLACE_TENANT_ID }}
          MARKETPLACE_WEBHOOK_SECRET: ${{ secrets.MARKETPLACE_WEBHOOK_SECRET }}
          PORTAL_ENTRA_CLIENT_ID: ${{ secrets.PORTAL_ENTRA_CLIENT_ID }}
          PORTAL_ENTRA_CLIENT_SECRET: ${{ secrets.PORTAL_ENTRA_CLIENT_SECRET }}
          PORTAL_NEXTAUTH_SECRET: ${{ secrets.PORTAL_NEXTAUTH_SECRET }}
          PORTAL_PUBLIC_URL: ${{ vars.PORTAL_PUBLIC_URL }}
        run: |
          API_FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          PORTAL_FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PORTAL_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          if [ -z "$API_FQDN" ] || [ -z "$PORTAL_FQDN" ]; then
            echo "Could not resolve the Container App ingress FQDNs for $API_APP_NAME and $PORTAL_APP_NAME." >&2
            exit 1
          fi

          PORTAL_PUBLIC_URL="${PORTAL_PUBLIC_URL%/}"
          export API_BASE_URL="https://${API_FQDN}"
          export PORTAL_URL="${PORTAL_PUBLIC_URL:-https://${PORTAL_FQDN}}"
          export PORTAL_URL="${PORTAL_URL%/}"

          # Keep the checked-in env files as the source of truth for post-deploy config.
          # If PORTAL_PUBLIC_URL is set, NEXTAUTH_URL and the Entra redirect URI must use that same public host.
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          pattern = re.compile(r'\{\{([A-Z0-9_]+)\}\}')
          secret_values = {
              'marketplace-client-secret': os.environ.get('MARKETPLACE_CLIENT_SECRET'),
              'marketplace-webhook-secret': os.environ.get('MARKETPLACE_WEBHOOK_SECRET'),
              'portal-entra-client-secret': os.environ.get('PORTAL_ENTRA_CLIENT_SECRET'),
              'portal-nextauth-secret': os.environ.get('PORTAL_NEXTAUTH_SECRET'),
          }

          missing_secret_values = [name for name, value in secret_values.items() if not value]
          if missing_secret_values:
              raise SystemExit(f'Missing GitHub Actions secrets for: {", ".join(missing_secret_values)}')

          def replace(match: re.Match[str]) -> str:
              name = match.group(1)
              resolved = os.environ.get(name)
              if resolved is None or resolved == '':
                  raise SystemExit(f'Missing value for placeholder {name}')
              return resolved

          def render_env_file(path: str) -> tuple[list[dict[str, str]], list[dict[str, str]]]:
              env_vars: list[dict[str, str]] = []
              app_secret_values: dict[str, str] = {}

              for raw_line in Path(path).read_text().splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if '=' not in line:
                      raise SystemExit(f'Invalid env entry: {raw_line}')

                  key, value = line.split('=', 1)
                  value = pattern.sub(replace, value)
                  env_vars.append({
                      'name': key,
                      'value': value,
                  })

                  if value.startswith('secretref:'):
                      secret_name = value.removeprefix('secretref:')
                      secret_value = secret_values.get(secret_name)
                      if not secret_value:
                          raise SystemExit(f'No GitHub Actions secret mapped for {secret_name}')
                      app_secret_values[secret_name] = secret_value

              secrets = [
                  {'name': name, 'value': value}
                  for name, value in sorted(app_secret_values.items())
              ]
              return env_vars, secrets

          api_env_vars, api_secrets = render_env_file('infrastructure/env/staging-api.env')
          portal_env_vars, portal_secrets = render_env_file('infrastructure/env/staging-portal.env')

          Path(os.environ['API_ENV_FILE']).write_text(json.dumps(api_env_vars, indent=2) + '\n')
          Path(os.environ['API_SECRETS_FILE']).write_text(json.dumps(api_secrets, indent=2) + '\n')
          Path(os.environ['PORTAL_ENV_FILE']).write_text(json.dumps(portal_env_vars, indent=2) + '\n')
          Path(os.environ['PORTAL_SECRETS_FILE']).write_text(json.dumps(portal_secrets, indent=2) + '\n')
          PY

      - name: Provision API secrets
        shell: bash
        env:
          APP_NAME: ${{ env.API_APP_NAME }}
          SECRETS_FILE: infrastructure/env/.generated-staging-api.secrets.json
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          secret_entries = json.loads(Path(os.environ['SECRETS_FILE']).read_text())
          if not secret_entries:
              raise SystemExit(0)

          subprocess.run([
              'az', 'containerapp', 'secret', 'set',
              '--name', os.environ['APP_NAME'],
              '--resource-group', os.environ['RESOURCE_GROUP'],
              '--secrets',
              *[f"{item['name']}={item['value']}" for item in secret_entries],
          ], check=True)
          PY

      - name: Update API container app
        shell: bash
        env:
          APP_NAME: ${{ env.API_APP_NAME }}
          ENV_FILE: infrastructure/env/.generated-staging-api.env.json
          IMAGE: ${{ env.API_IMAGE }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          env_entries = json.loads(Path(os.environ['ENV_FILE']).read_text())
          command = [
              'az', 'containerapp', 'update',
              '--name', os.environ['APP_NAME'],
              '--resource-group', os.environ['RESOURCE_GROUP'],
              '--image', os.environ['IMAGE'],
          ]
          if env_entries:
              command.extend([
                  '--set-env-vars',
                  *[f"{item['name']}={item['value']}" for item in env_entries],
              ])

          # Apply the new image and env vars in one revision so the app never boots with stale config.
          subprocess.run(command, check=True)
          PY

      - name: Provision portal secrets
        shell: bash
        env:
          APP_NAME: ${{ env.PORTAL_APP_NAME }}
          SECRETS_FILE: infrastructure/env/.generated-staging-portal.secrets.json
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          secret_entries = json.loads(Path(os.environ['SECRETS_FILE']).read_text())
          if not secret_entries:
              raise SystemExit(0)

          subprocess.run([
              'az', 'containerapp', 'secret', 'set',
              '--name', os.environ['APP_NAME'],
              '--resource-group', os.environ['RESOURCE_GROUP'],
              '--secrets',
              *[f"{item['name']}={item['value']}" for item in secret_entries],
          ], check=True)
          PY

      - name: Update portal container app
        shell: bash
        env:
          APP_NAME: ${{ env.PORTAL_APP_NAME }}
          ENV_FILE: infrastructure/env/.generated-staging-portal.env.json
          IMAGE: ${{ env.PORTAL_IMAGE }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          env_entries = json.loads(Path(os.environ['ENV_FILE']).read_text())
          command = [
              'az', 'containerapp', 'update',
              '--name', os.environ['APP_NAME'],
              '--resource-group', os.environ['RESOURCE_GROUP'],
              '--image', os.environ['IMAGE'],
          ]
          if env_entries:
              command.extend([
                  '--set-env-vars',
                  *[f"{item['name']}={item['value']}" for item in env_entries],
              ])

          # Apply the new image and env vars in one revision so the app never boots with stale config.
          subprocess.run(command, check=True)
          PY

      - name: Read container app endpoints
        id: deployment
        shell: bash
        env:
          PORTAL_PUBLIC_URL: ${{ vars.PORTAL_PUBLIC_URL }}
        run: |
          API_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          PORTAL_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$PORTAL_APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          API_URL="https://${API_FQDN}"
          ACA_PORTAL_URL="https://${PORTAL_FQDN}"
          PORTAL_PUBLIC_URL="${PORTAL_PUBLIC_URL%/}"
          PORTAL_URL="${PORTAL_PUBLIC_URL:-$ACA_PORTAL_URL}"

          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "portal_url=$PORTAL_URL" >> "$GITHUB_OUTPUT"
          echo "aca_portal_url=$ACA_PORTAL_URL" >> "$GITHUB_OUTPUT"

      - name: Verify health checks
        shell: bash
        timeout-minutes: 10
        env:
          API_URL: ${{ steps.deployment.outputs.api_url }}
          PORTAL_URL: ${{ steps.deployment.outputs.portal_url }}
          ACA_PORTAL_URL: ${{ steps.deployment.outputs.aca_portal_url }}
        run: |
          check_health() {
            local name="$1"
            local base_url="$2"
            local attempt=1
            local max_attempts=32

            while [ "$attempt" -le "$max_attempts" ]; do
              if curl --fail --show-error --silent "$base_url/health" >/dev/null; then
                echo "$name health check passed"
                return 0
              fi

              echo "$name health check attempt $attempt/$max_attempts failed; retrying in 15 seconds"
              sleep 15
              attempt=$((attempt + 1))
            done

            echo "$name health check failed after $max_attempts attempts" >&2
            curl --include --silent --show-error "$base_url/health" || true
            return 1
          }

          check_health "API" "$API_URL"
          check_health "Portal" "$PORTAL_URL"

          if [ "$PORTAL_URL" != "$ACA_PORTAL_URL" ]; then
            check_health "Portal ACA" "$ACA_PORTAL_URL"
          fi

      - name: Clean generated deployment config
        if: always()
        run: |
          rm -f \
            infrastructure/env/.generated-staging-api.env.json \
            infrastructure/env/.generated-staging-api.secrets.json \
            infrastructure/env/.generated-staging-portal.env.json \
            infrastructure/env/.generated-staging-portal.secrets.json
